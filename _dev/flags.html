<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flags (dev)</title>
<style>body{font:14px/1.3 system-ui;background:#efe6d6;margin:16px}#g{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.c{background:#fff;border-radius:8px;padding:8px}.c canvas{width:100%;height:auto;outline:1px solid #0002;display:block}
.n{font-weight:700;margin-top:6px}.sw{display:flex;gap:3px;margin-top:4px}.sw i{width:18px;height:12px;border:1px solid #0003}</style></head>
<body><div id="g"></div>
<script type="module">
import { COUNTRIES } from '../js/data/countries.js';
import { flagCanvas } from '../js/flags.js';
const g = document.getElementById('g');
for (const c of COUNTRIES) {
  const d = document.createElement('div'); d.className = 'c';
  d.appendChild(flagCanvas(c.code, 360));
  d.insertAdjacentHTML('beforeend', `<div class="n">${c.name} <small>(${c.code})</small></div><div>${c.capital}</div><div class="sw"><i style="background:${c.paint.shirt}"></i><i style="background:${c.paint.shorts}"></i><i style="background:${c.paint.trim}"></i></div>`);
  g.appendChild(d);
}
</script></body></html>
